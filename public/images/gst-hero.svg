<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="500" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14263d" stop-opacity=".95"/>
      <stop offset="1" stop-color="#244063"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9ac40"/>
      <stop offset="1" stop-color="#e2bf68"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="60" y2="60">
      <stop offset="0" stop-color="#e2bf68"/>
      <stop offset="1" stop-color="#c9a84c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="500" height="400" fill="url(#g1)"/>
  <circle cx="420" cy="60" r="120" fill="#d9ac40" opacity=".06"/>
  <circle cx="80" cy="340" r="90" fill="#d9ac40" opacity=".05"/>
  <!-- Grid pattern -->
  <g stroke="#d9ac40" stroke-opacity=".08" stroke-width="0.5">
    <line x1="0" y1="50" x2="500" y2="50"/><line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="150" x2="500" y2="150"/><line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="250" x2="500" y2="250"/><line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="350" x2="500" y2="350"/>
    <line x1="50" y1="0" x2="50" y2="400"/><line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/><line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
  </g>
  <!-- Document / Invoice card -->
  <rect x="130" y="80" width="200" height="260" rx="14" fill="white" fill-opacity=".06" stroke="#d9ac40" stroke-opacity=".25" stroke-width="1.5"/>
  <rect x="150" y="105" width="100" height="10" rx="5" fill="#d9ac40" opacity=".6"/>
  <rect x="150" y="128" width="160" height="5" rx="2.5" fill="white" opacity=".12"/>
  <rect x="150" y="143" width="160" height="5" rx="2.5" fill="white" opacity=".08"/>
  <rect x="150" y="158" width="160" height="5" rx="2.5" fill="white" opacity=".06"/>
  <rect x="150" y="178" width="75" height="8" rx="4" fill="#d9ac40" opacity=".2"/>
  <rect x="150" y="196" width="160" height="2" fill="white" opacity=".08"/>
  <rect x="150" y="208" width="80" height="8" rx="4" fill="white" opacity=".1"/>
  <rect x="150" y="225" width="160" height="2" fill="white" opacity=".08"/>
  <rect x="150" y="240" width="90" height="8" rx="4" fill="white" opacity=".1"/>
  <rect x="150" y="258" width="160" height="2" fill="white" opacity=".08"/>
  <rect x="150" y="275" width="60" height="30" rx="6" fill="url(#gold1)" opacity=".85"/>
  <text x="180" y="294" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#14263d" text-anchor="middle">GST</text>
  <!-- % symbol -->
  <circle cx="380" cy="120" r="32" fill="#d9ac40" opacity=".12" stroke="#d9ac40" stroke-opacity=".35" stroke-width="1.5"/>
  <text x="380" y="130" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#d9ac40" text-anchor="middle" opacity=".8">%</text>
  <!-- Tax badge -->
  <rect x="340" y="260" width="100" height="38" rx="8" fill="#d9ac40" opacity=".15" stroke="#d9ac40" stroke-opacity=".3" stroke-width="1"/>
  <text x="390" y="284" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#d9ac40" text-anchor="middle" opacity=".9">Tax</text>
  <!-- AI sparkle -->
  <circle cx="100" cy="130" r="4" fill="#d9ac40" opacity=".45"/>
  <circle cx="112" cy="118" r="2.5" fill="#e2bf68" opacity=".35"/>
  <circle cx="88" cy="118" r="2" fill="#e2bf68" opacity=".3"/>
  <circle cx="400" cy="340" r="3" fill="#d9ac40" opacity=".35"/>
  <circle cx="390" cy="355" r="2" fill="#e2bf68" opacity=".3"/>
</svg>